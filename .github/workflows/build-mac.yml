name: Compila app Mac

# Compila TimbroEasyPDF come app .app per Mac (Apple Silicon) sui runner macOS di GitHub.
# Avvio manuale (Actions ▸ "Compila app Mac" ▸ Run workflow). Richiede un metodo di
# pagamento registrato sull'account GitHub per sbloccare i runner macOS (uso gratuito
# sui repository pubblici). In alternativa si usa lo script build_mac.command su un Mac.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14          # Apple Silicon (arm64)
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pyinstaller

      - name: Crea l'icona dell'app (facoltativa)
        continue-on-error: true
        run: |
          python -c "import timbro_pdf as tp; tp.icon_pixmap(1024).save('icon.png')"
          sips -s format icns icon.png --out icon.icns

      - name: Compila l'app
        run: |
          ICON=""
          [ -f icon.icns ] && ICON="--icon icon.icns"
          pyinstaller --noconfirm --windowed --name TimbroEasyPDF $ICON \
            --osx-bundle-identifier com.cbcengineering.timbroeasypdf \
            --add-data "tessdata:tessdata" \
            --add-data "Guida TimbroEasyPDF.pdf:." \
            timbro_pdf.py

      - name: Comprimi il bundle (conservando i permessi del Mac)
        run: |
          cd dist
          ditto -c -k --keepParent "TimbroEasyPDF.app" "TimbroEasyPDF-mac.zip"

      - name: Carica l'app compilata
        uses: actions/upload-artifact@v4
        with:
          name: TimbroEasyPDF-mac
          path: dist/TimbroEasyPDF-mac.zip
          if-no-files-found: error
